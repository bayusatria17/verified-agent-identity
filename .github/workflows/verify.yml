name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Identity File
        run: |
          echo "Checking identity file..."
          if [ -f "bayusatria17.txt" ]; then
            echo "Identity file found ✅"
          else
            echo "Identity file NOT found ❌"
            exit 1
          fi

      - name: Show File Content
        run: |
          echo "Your identity:"
          cat bayusatria17.txt

      - name: Link Human to Agent
        run: |
          echo "✅ Verification Success"
          echo "👉 Copy this link and open in browser:"
          echo "https://billions.network/verify?user=bayusatria17
